name: build-windows-installer
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path LoomDAW-Desktop.zip -DestinationPath .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build VST host
        working-directory: LoomDAW-Desktop
        shell: pwsh
        run: |
          cmake -S host -B host/_b -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build host/_b --config Release --parallel
          New-Item -ItemType Directory -Force build/host | Out-Null
          $exe = Get-ChildItem -Recurse host/_b -Filter LoomVstHost.exe | Select-Object -First 1
          Copy-Item $exe.FullName build/host/LoomVstHost.exe
      - name: Install npm deps
        working-directory: LoomDAW-Desktop
        run: npm install
      - name: Build installer
        working-directory: LoomDAW-Desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: install-exe
          path: LoomDAW-Desktop/dist/install.exe
